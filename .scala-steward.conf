# Scala Steward Configuration for mcp4s

# Update pull requests
pullRequests.frequency = "30 days"

# Group related dependencies into single PRs
pullRequests.grouping = [
  { name = "cats-ecosystem", filter = [{ group = "org.typelevel" }] },
  { name = "http4s-ecosystem", filter = [{ group = "org.http4s" }] },
  { name = "circe", filter = [{ group = "io.circe" }] },
  { name = "sttp", filter = [{ group = "com.softwaremill.sttp" }] }
]

# Limit concurrent open PRs
updates.limit = 5

# Hold http4s at 0.23.34. 0.23.35 regressed ember's parallel request throughput
# (concurrent calls serialize; see build.sbt), so newer 0.23.x are not usable yet.
# Pin only the core artifacts by name — http4s-jdk-http-client shares the org.http4s
# groupId but is versioned independently (0.9.x) and must stay free to update.
updates.pin = [
  { groupId = "org.http4s", artifactId = "http4s-ember-server", version = "0.23.34" },
  { groupId = "org.http4s", artifactId = "http4s-ember-client", version = "0.23.34" },
  { groupId = "org.http4s", artifactId = "http4s-client", version = "0.23.34" },
  { groupId = "org.http4s", artifactId = "http4s-dsl", version = "0.23.34" },
  { groupId = "org.http4s", artifactId = "http4s-circe", version = "0.23.34" }
]

# Commit message format
commits.message = "Update ${artifactName} from ${currentVersion} to ${nextVersion}"

version = "3.11.4"
runner.dialect = scala3
maxColumn = 100
align.preset = more
rewrite.rules = [Imports, RedundantBraces, SortModifiers]
rewrite.imports.sort = scalastyle

# Enforce modern braceless Scala 3: new control syntax (if/then, star imports,
# vararg splices) and no optional braces on declarations. fewerBraces is left
# unset (disabled) deliberately — munit test("...") { } blocks and lambda
# arguments keep their braces.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.optionalBraces = {
  enabled = true
  oldSyntaxToo = true
}

# The sbt metabuild (project/*.scala) compiles with Scala 2.12 — keep the
# Scala 2 dialect there so the scala3 rewrites above never touch it.
fileOverride {
  "glob:**/project/*.scala" {
    runner.dialect = scala212
  }
}

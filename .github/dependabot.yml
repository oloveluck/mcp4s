version: 2
updates:
  # Update git submodules (conformance tests)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "conformance"

  # NOTE: no "github-actions" ecosystem here on purpose. The workflows under
  # .github/workflows are GENERATED by sbt-typelevel (githubWorkflowGenerate) and
  # verified in CI by `sbt githubWorkflowCheck`. Dependabot bumps to the generated
  # YAML always fail that check, so those PRs can never merge. Action versions are
  # managed at their real source instead: `checkout`/`upload-artifact`/
  # `download-artifact` follow the sbt-typelevel plugin version (bumped via
  # scala-steward on project/plugins.sbt), and `setup-node`/`coursier-setup-action`
  # are pinned explicitly in build.sbt.

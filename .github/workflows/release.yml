name: GitHub Release

# Creates a GitHub Release for each pushed v* tag. Maven Central publishing is
# handled separately by the generated ci.yml (tlCiRelease); this only mirrors the
# release onto the GitHub Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
